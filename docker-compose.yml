services:
  db:
    image: postgres:16
    container_name: little-notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: little_notes
      POSTGRES_PASSWORD: little_notes_password
      POSTGRES_DB: little_notes_db
    ports:
      - "5432:5432"
    volumes:
      - little_notes_pgdata:/var/lib/postgresql/data

volumes:
  little_notes_pgdata: